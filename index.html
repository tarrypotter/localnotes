<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f6f7fb"><title>모아노트 · Local Notes</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light;--bg:#f6f7fb;--panel:#fff;--ink:#182238;--muted:#768096;--line:#e8ebf2;--accent:#5865df;--soft:#eef0ff;--warn:#bd4554;--shadow:0 8px 30px rgba(21,32,68,.05)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:not-allowed}body.dark{color-scheme:dark;--bg:#101522;--panel:#1b2333;--ink:#eef1f9;--muted:#a5afc4;--line:#333d51;--accent:#9ba5ff;--soft:#2a3355;--shadow:none}#app{max-width:800px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{background:var(--soft);color:var(--accent);border:0;border-radius:30px;padding:10px 13px;font-weight:700}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:13px}.content{padding:18px 16px calc(95px + env(safe-area-inset-bottom));min-height:75vh}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);outline:0;color:var(--ink);font-size:16px}.sectiontitle{font-size:13px;color:var(--muted);font-weight:750;margin:20px 2px 12px}.chips{display:flex;gap:8px;overflow-x:auto;padding:5px 0 9px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;white-space:nowrap;padding:9px 13px;font-size:13px}.chip.active{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:750}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.note{min-height:160px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--ink);overflow:hidden}.note .nTitle{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note .preview{color:var(--muted);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.note .meta{margin-top:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:4px}.empty{text-align:center;padding:55px 16px;color:var(--muted);line-height:1.8}.empty strong{display:block;font-size:20px;color:var(--ink)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:800px;width:100%;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(8px + env(safe-area-inset-bottom));z-index:15}.nav button{border:0;background:none;color:var(--muted);padding:7px 0;font-size:12px;display:flex;align-items:center;flex-direction:column;gap:5px}.nav button.active{color:var(--accent);font-weight:800}.nav .symbol{font-size:21px}.fab{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 800px)/2 + 22px));height:54px;width:54px;background:var(--accent);border:0;border-radius:18px;color:#fff;font-size:27px;box-shadow:0 6px 18px #5865df4a;z-index:9}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.action{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 14px;border-radius:12px;font-weight:700}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--warn)}.hint{font-size:12px;color:var(--muted);line-height:1.65}.folderitem{width:100%;text-align:left;margin-bottom:9px}.editor{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}.editor.open{display:block}.editorhead{position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.editinside{max-width:760px;margin:auto;padding:22px 18px 140px}.titleinput{width:100%;font-size:26px;font-weight:820;letter-spacing:-.8px;background:none;border:0;outline:0;color:var(--ink);margin-bottom:15px}.bodyinput{width:100%;min-height:52vh;resize:none;background:none;border:0;outline:0;color:var(--ink);font-size:16px;line-height:1.8}.foottools{position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--panel);border-top:1px solid var(--line);padding:10px max(15px,calc((100vw - 750px)/2));padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between}.foottools button{flex:1}.field{width:100%;border:1px solid var(--line);padding:12px;border-radius:12px;background:var(--panel);color:var(--ink);font-size:16px}.modal{position:fixed;inset:0;background:#0e142080;z-index:60;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--panel);border-radius:25px 25px 0 0;padding:20px;width:100%;max-width:700px;max-height:85dvh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 16px}.sheet button{margin:3px}.settingline{padding:15px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#252d43;color:#fff;border-radius:99px;padding:11px 18px;font-size:13px;z-index:99;display:none;white-space:nowrap;max-width:90vw}.toast.show{display:block}@media(min-width:650px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:370px){.foottools .action{font-size:12px;padding:10px 6px}}@media(prefers-reduced-motion:no-preference){.note,.action,.chip{transition:background .15s,border-color .15s}}
</style></head><body><div id="app"><header class="top"><div class="bar"><div><div class="brand">✦ 모아노트</div><div class="sub" id="subtitle">나만의 로컬 노트</div></div><button class="pill" id="topAction">+ 새 노트</button></div></header><main class="content" id="view"></main><button class="fab" id="fab" title="새 노트">+</button><nav class="nav"><button data-tab="all" class="active"><span class="symbol">▤</span>전체 노트</button><button data-tab="folders"><span class="symbol">▦</span>폴더</button><button data-tab="favorites"><span class="symbol">☆</span>즐겨찾기</button><button data-tab="settings"><span class="symbol">⚙</span>설정</button></nav></div>
<section class="editor" id="editor"><div class="editorhead"><div class="bar"><button class="action" id="backBtn">← 돌아가기</button><span class="hint" id="saveStatus">자동 저장</span><button class="action" id="moreBtn">···</button></div></div><div class="editinside"><input class="titleinput" id="noteTitle" maxlength="140" placeholder="노트 제목"><textarea class="bodyinput" id="noteBody" placeholder="여기에 자유롭게 기록해 보세요."></textarea><div class="hint" id="editedAt"></div></div><div class="foottools"><button class="action" id="folderBtn">▦ 폴더</button><button class="action" id="favoriteBtn">☆ 즐겨찾기</button><button class="action primary" id="shareBtn">↗ 공유</button></div></section>
<div class="modal" id="modal"><div class="sheet"><div class="bar"><h3 id="modalTitle"></h3><button class="iconbtn" id="closeModal">✕</button></div><div id="modalContent"></div></div></div><div class="toast" id="toast"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),DB='moanote-db',STORE='state';let db=null,state={notes:[],folders:[{id:'default',name:'기본 폴더'}],theme:'system'},tab='all',filter='all',search='',editing=null,saveTimer=0,toastTimer=0;
const id=()=>globalThis.crypto?.randomUUID?.()||('n'+Date.now()+Math.random().toString(36).slice(2));
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>new Date(x).toLocaleDateString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('app');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function writeDB(){if(!db)return Promise.reject(new Error('DB 미연결'));return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function save(){try{await writeDB();if(editing)$('saveStatus').textContent='✓ 저장됨'}catch(e){toast('저장 실패 · JSON 백업을 이용하세요');console.error(e)}}
function scheduleSave(){if(editing)$('saveStatus').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function folderName(fid){return state.folders.find(f=>f.id===fid)?.name||'기본 폴더'}
function selectTab(t){flushEditor();tab=t;filter='all';search='';render()}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('fab').hidden=tab==='settings';$('topAction').hidden=tab==='settings';$('subtitle').textContent=({all:'나만의 로컬 노트',folders:'내 폴더 관리',favorites:'중요한 기록 모아보기',settings:'저장 및 앱 설정'})[tab];if(tab==='settings')return renderSettings();if(tab==='folders')return renderFolders();renderNotes()}
function renderNotes(){let list=state.notes.filter(n=>tab!=='favorites'||n.favorite).filter(n=>filter==='all'||n.folderId===filter).filter(n=>(n.title+' '+n.body).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.updated-a.updated);$('view').innerHTML=`<input class="search" id="search" placeholder="⌕  제목이나 내용 검색" value="${escapeHtml(search)}"><div class="chips" id="chips"><button class="chip ${filter==='all'?'active':''}" data-folder="all">전체</button>${state.folders.map(f=>`<button class="chip ${filter===f.id?'active':''}" data-folder="${escapeHtml(f.id)}">${escapeHtml(f.name)}</button>`).join('')}</div><div class="sectiontitle">${tab==='favorites'?'즐겨찾기':'내 노트'} · ${list.length}개</div><div class="cards">${list.map(n=>`<button class="note" data-note="${escapeHtml(n.id)}"><span class="nTitle">${n.favorite?'★ ':''}${escapeHtml(n.title||'제목 없음')}</span><span class="preview">${escapeHtml(n.body||'내용을 작성해 보세요')}</span><span class="meta"><span>${escapeHtml(folderName(n.folderId))}</span><span>${fmt(n.updated)}</span></span></button>`).join('')}</div>${list.length?'':'<div class="empty"><strong>아직 노트가 없어요</strong>아래 + 버튼으로 첫 기록을 만들어 보세요.</div>'}`;$('search').addEventListener('input',e=>{search=e.target.value;let p=e.target.selectionStart;renderNotes();$('search').focus();$('search').setSelectionRange(p,p)});document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{filter=b.dataset.folder;renderNotes()});document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>openEditor(b.dataset.note))}
function renderFolders(){$('view').innerHTML=`<div class="panel"><div class="row"><div><strong>폴더 관리</strong><div class="hint">노트를 분류하고 쉽게 찾아보세요.</div></div><button class="action primary" id="newFolder">+ 추가</button></div></div>${state.folders.map(f=>`<div class="panel row"><button class="action folderitem" data-openfolder="${escapeHtml(f.id)}">▦ ${escapeHtml(f.name)} <span class="hint">(${state.notes.filter(n=>n.folderId===f.id).length})</span></button><button class="action" data-rename="${escapeHtml(f.id)}">수정</button>${f.id==='default'?'':`<button class="action danger" data-del="${escapeHtml(f.id)}">삭제</button>`}</div>`).join('')}`;$('newFolder').onclick=addFolder;document.querySelectorAll('[data-openfolder]').forEach(b=>b.onclick=()=>{tab='all';filter=b.dataset.openfolder;render()});document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let f=state.folders.find(f=>f.id===b.dataset.rename),v=prompt('새 폴더 이름',f.name);if(v?.trim()){f.name=v.trim().slice(0,35);await save();render()}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let f=state.folders.find(f=>f.id===b.dataset.del);if(confirm(`“${f.name}” 폴더를 삭제할까요? 안의 노트는 기본 폴더로 이동합니다.`)){state.notes.forEach(n=>{if(n.folderId===f.id)n.folderId='default'});state.folders=state.folders.filter(x=>x.id!==f.id);await save();render()}})}
async function addFolder(){let v=prompt('새 폴더 이름');if(!v?.trim())return;state.folders.push({id:id(),name:v.trim().slice(0,35)});await save();render()}
function renderSettings(){$('view').innerHTML=`<div class="panel"><strong>데이터 보관</strong><p class="hint">노트는 이 브라우저의 IndexedDB에 저장됩니다. 서버로 전송하지 않습니다. 브라우저 데이터 삭제, 기기 변경 등에 대비해 JSON 백업을 보관하세요.</p><div class="row"><button class="action primary" id="backup">↓ JSON 백업</button><button class="action" id="restore">↑ 백업 복원</button></div></div><div class="panel"><strong>화면 테마</strong><p class="hint">선택 즉시 적용됩니다.</p><select class="field" id="theme"><option value="system">기기 설정에 맞춤</option><option value="light">라이트</option><option value="dark">다크</option></select></div><div class="panel"><strong>앱 정보</strong><p class="hint">오프라인 단일 HTML · 로컬 자동 저장 · 폴더 · 검색 · 즐겨찾기 · PNG/텍스트 공유 · 인쇄/PDF</p><div class="row"><span class="hint">노트 ${state.notes.length}개 / 폴더 ${state.folders.length}개</span><button class="action danger" id="reset">전체 초기화</button></div></div>`;$('theme').value=state.theme;$('theme').onchange=async e=>{state.theme=e.target.value;applyTheme();await save()};$('backup').onclick=backup;$('restore').onclick=()=>$('importFile').click();$('reset').onclick=async()=>{if(confirm('모든 노트와 폴더를 영구 삭제할까요? 복구할 수 없습니다.')&&confirm('최종 확인: 정말 모두 삭제하시겠습니까?')){state.notes=[];state.folders=[{id:'default',name:'기본 폴더'}];await save();render();toast('초기화 완료')}}}
function newNote(){let n={id:id(),title:'',body:'',folderId:filter!=='all'?filter:'default',favorite:false,created:Date.now(),updated:Date.now()};state.notes.unshift(n);save();openEditor(n.id)}
function openEditor(nid){editing=state.notes.find(n=>n.id===nid);if(!editing)return;$('noteTitle').value=editing.title;$('noteBody').value=editing.body;$('saveStatus').textContent='✓ 저장됨';$('editedAt').textContent='마지막 수정 '+fmt(editing.updated);$('favoriteBtn').textContent=editing.favorite?'★ 즐겨찾기':'☆ 즐겨찾기';$('editor').classList.add('open');$('editor').scrollTop=0}
function flushEditor(){if(!editing)return;editing.title=$('noteTitle').value;editing.body=$('noteBody').value;clearTimeout(saveTimer);save();editing=null}
$('noteTitle').oninput=$('noteBody').oninput=()=>{if(!editing)return;editing.title=$('noteTitle').value;editing.body=$('noteBody').value;editing.updated=Date.now();scheduleSave()};$('backBtn').onclick=()=>{flushEditor();$('editor').classList.remove('open');render()};$('favoriteBtn').onclick=()=>{if(!editing)return;editing.favorite=!editing.favorite;$('favoriteBtn').textContent=editing.favorite?'★ 즐겨찾기':'☆ 즐겨찾기';save();toast(editing.favorite?'즐겨찾기에 추가':'즐겨찾기 해제')};$('folderBtn').onclick=()=>{showModal('폴더 선택',state.folders.map(f=>`<button class="action" data-pick="${escapeHtml(f.id)}">${escapeHtml(f.name)} ${editing.folderId===f.id?'✓':''}</button>`).join(''));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{editing.folderId=b.dataset.pick;save();closeModal();toast('폴더 변경 완료')})};
$('moreBtn').onclick=()=>{showModal('노트 관리',`<button class="action" id="duplicate">⧉ 복제하기</button><button class="action danger" id="delete">휴지통 없이 삭제</button><p class="hint">삭제한 노트는 복원할 수 없습니다. 중요한 내용은 백업하세요.</p>`);$('duplicate').onclick=async()=>{let n={...editing,id:id(),title:(editing.title||'제목 없음')+' (복사)',created:Date.now(),updated:Date.now()};state.notes.unshift(n);await save();closeModal();flushEditor();openEditor(n.id);toast('노트 복제 완료')};$('delete').onclick=async()=>{if(!confirm('이 노트를 삭제할까요?'))return;state.notes=state.notes.filter(n=>n.id!==editing.id);editing=null;await save();closeModal();$('editor').classList.remove('open');render();toast('노트 삭제 완료')}};
function showModal(t,html){$('modalTitle').textContent=t;$('modalContent').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function backup(){download(new Blob([JSON.stringify({app:'moanote',version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),'moanote-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('백업 파일 저장 완료')}
$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.app!=='moanote'||!Array.isArray(j.data?.notes)||!Array.isArray(j.data?.folders))throw Error('잘못된 형식');if(!confirm(`노트 ${j.data.notes.length}개를 복원할까요? 기존 노트는 대체됩니다.`))return;state={notes:j.data.notes,folders:j.data.folders,theme:j.data.theme||'system'};await save();applyTheme();render();toast('복원 완료')}catch(err){alert('복원에 실패했습니다. 모아노트 JSON 백업인지 확인하세요.')}finally{e.target.value=''}};
// Wrapped canvas cards: export a sequence of full-content PNG pages without content clipping.
function makePages(n){let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas not available');const W=1000,H=1414,margin=78,textW=W-margin*2;canvas.width=W;canvas.height=H;let lines=[],font='32px sans-serif';ctx.font=font;let paragraphs=(n.body||' ').replace(/\t/g,'    ').split('\n');for(let paragraph of paragraphs){if(!paragraph){lines.push('');continue}let line='';for(let ch of paragraph){if(ctx.measureText(line+ch).width>textW&&line){lines.push(line);line=ch}else line+=ch}lines.push(line)}let per=29,pages=[];for(let start=0;start<lines.length||start===0;start+=per){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5966dd';ctx.fillRect(margin,72,72,7);ctx.fillStyle='#1b2840';ctx.font='bold 47px sans-serif';let title=n.title||'제목 없음';while(ctx.measureText(title).width>textW&&title.length>1)title=title.slice(0,-2)+'…';ctx.fillText(title,margin,160);ctx.fillStyle='#728099';ctx.font='24px sans-serif';ctx.fillText('모아노트  ·  '+new Date(n.updated).toLocaleDateString('ko-KR'),margin,207);ctx.strokeStyle='#e7eaf0';ctx.beginPath();ctx.moveTo(margin,242);ctx.lineTo(W-margin,242);ctx.stroke();ctx.font=font;ctx.fillStyle='#263247';lines.slice(start,start+per).forEach((line,i)=>ctx.fillText(line,margin,300+i*35));ctx.fillStyle='#a0a9ba';ctx.font='22px sans-serif';ctx.fillText(`${Math.floor(start/per)+1} / ${Math.max(1,Math.ceil(lines.length/per))}`,W-165,H-64);pages.push(canvas.toDataURL('image/png'))}return pages}
async function shareText(n){let txt=(n.title||'제목 없음')+'\n\n'+n.body;if(navigator.share){try{await navigator.share({title:n.title||'모아노트',text:txt});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(txt);toast('전체 텍스트 복사 완료')}catch(e){let t=document.createElement('textarea');t.value=txt;t.style.position='fixed';document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('전체 텍스트 복사 완료')}}
async function shareImages(n){let imgs=makePages(n);let files=await Promise.all(imgs.map(async (s,i)=>new File([await(await fetch(s)).blob()],`moanote-${i+1}.png`,{type:'image/png'})));if(navigator.canShare?.({files})&&navigator.share){try{await navigator.share({files,title:n.title||'모아노트'});return}catch(e){if(e.name==='AbortError')return}}imgs.forEach((s,i)=>{let a=document.createElement('a');a.href=s;a.download=`moanote-${i+1}.png`;document.body.append(a);a.click();a.remove()});toast(`PNG ${imgs.length}장 저장 완료`)}
function shareLong(n){let imgs=makePages(n);if(imgs.length===1){downloadData(imgs[0],'moanote-long.png');return}let first=document.createElement('img');first.onload=()=>{let c=document.createElement('canvas');c.width=first.naturalWidth;c.height=first.naturalHeight*imgs.length;if(c.height>32000){toast('너무 길어서 여러 장 PNG를 이용해 주세요');return}let ctx=c.getContext('2d'),loaded=0;imgs.forEach((s,i)=>{let im=new Image();im.onload=()=>{ctx.drawImage(im,0,i*first.naturalHeight);if(++loaded===imgs.length)downloadData(c.toDataURL('image/png'),'moanote-long.png')};im.src=s})};first.src=imgs[0]}
function downloadData(s,name){let a=document.createElement('a');a.href=s;a.download=name;document.body.append(a);a.click();a.remove();toast('이미지 저장 완료')}
function printNote(n){let frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-9999px;width:1px;height:1px';document.body.append(frame);let d=frame.contentDocument;d.open();d.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>노트 PDF</title><style>body{font:16px/1.8 sans-serif;padding:30px;color:#1a2538}h1{font-size:26px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}@page{margin:18mm}</style></head><body><h1>'+escapeHtml(n.title||'제목 없음')+'</h1><pre>'+escapeHtml(n.body)+'</pre></body></html>');d.close();setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),1500)},250)}
$('shareBtn').onclick=()=>{if(!editing)return;let n={...editing};showModal('공유 및 내보내기',`<p class="hint">내용 길이에 맞춰 여러 장 PNG로 나눌 수 있습니다. 기기에서 지원하면 공유 시트를 엽니다.</p><div style="display:grid;gap:8px"><button class="action primary" id="multiPng">▧ 여러 장 PNG (기본)</button><button class="action" id="longPng">▤ 긴 이미지 한 장</button><button class="action" id="pdfPrint">▤ PDF 저장 / 인쇄</button><button class="action" id="copyText">⧉ 전체 텍스트 복사 / 공유</button></div>`);$('multiPng').onclick=async()=>{closeModal();try{await shareImages(n)}catch(e){alert('이미지 공유 실패: '+e.message)}};$('longPng').onclick=()=>{closeModal();try{shareLong(n)}catch(e){alert(e.message)}};$('pdfPrint').onclick=()=>{closeModal();printNote(n)};$('copyText').onclick=()=>{closeModal();shareText(n)}};
$('fab').onclick=$('topAction').onclick=newNote;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();if(editing){flushEditor();$('editor').classList.remove('open');render()}else backup()}if(e.key==='Escape'&&$('modal').classList.contains('show'))closeModal()});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>{if(!['INPUT','TEXTAREA'].includes(e.target.tagName))e.preventDefault()});
(async()=>{try{db=await openDB();let saved=await readDB();if(saved?.notes&&saved?.folders)state=saved;applyTheme();render();if(!localStorage.getItem('moanote-welcome-v1')){showModal('모아노트에 오신 것을 환영해요',`<p class="hint">모든 기록은 현재 기기의 브라우저에 보관됩니다. 노트는 자동 저장되고, <b>설정 → JSON 백업</b>으로 다른 기기로 옮길 수 있어요.</p><button class="action primary" id="welcomeOk">시작하기</button>`);$('welcomeOk').onclick=()=>{localStorage.setItem('moanote-welcome-v1','1');closeModal()}}}catch(e){console.error(e);$('view').innerHTML='<div class="empty"><strong>로컬 저장소 연결 실패</strong>일반 브라우저에서 열어 주세요. 사생활 보호 모드나 제한된 미리보기에서는 저장이 차단될 수 있습니다.</div>';toast('로컬 저장소 확인 필요')}})();
})();
