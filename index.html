<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f6f7fb"><title>모아노트 · Local Notes</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light;--bg:#f6f7fb;--panel:#fff;--ink:#182238;--muted:#768096;--line:#e8ebf2;--accent:#5865df;--soft:#eef0ff;--warn:#bd4554;--shadow:0 8px 30px rgba(21,32,68,.05)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:not-allowed}body.dark{color-scheme:dark;--bg:#101522;--panel:#1b2333;--ink:#eef1f9;--muted:#a5afc4;--line:#333d51;--accent:#9ba5ff;--soft:#2a3355;--shadow:none}#app{max-width:800px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:850;letter-spacing:-1px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{background:var(--soft);color:var(--accent);border:0;border-radius:30px;padding:10px 13px;font-weight:700}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:13px}.content{padding:18px 16px calc(95px + env(safe-area-inset-bottom));min-height:75vh}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);outline:0;color:var(--ink);font-size:16px}.sectiontitle{font-size:13px;color:var(--muted);font-weight:750;margin:20px 2px 12px}.chips{display:flex;gap:8px;overflow-x:auto;padding:5px 0 9px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;white-space:nowrap;padding:9px 13px;font-size:13px}.chip.active{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:750}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.note{min-height:160px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;text-align:left;color:var(--ink);overflow:hidden}.note.selected{border:2px solid var(--accent);background:var(--soft)}.folderDot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}.note .nTitle{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note .preview{color:var(--muted);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.bulkbar{position:sticky;top:84px;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bulkbar .action{padding:8px;font-size:12px}.note .meta{margin-top:auto;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:space-between;gap:4px}.empty{text-align:center;padding:55px 16px;color:var(--muted);line-height:1.8}.empty strong{display:block;font-size:20px;color:var(--ink)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:800px;width:100%;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(8px + env(safe-area-inset-bottom));z-index:15}.nav button{border:0;background:none;color:var(--muted);padding:7px 0;font-size:12px;display:flex;align-items:center;flex-direction:column;gap:5px}.nav button.active{color:var(--accent);font-weight:800}.nav .symbol{font-size:21px}.fab{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 800px)/2 + 22px));height:54px;width:54px;background:var(--accent);border:0;border-radius:18px;color:#fff;font-size:27px;box-shadow:0 6px 18px #5865df4a;z-index:9}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.action{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 14px;border-radius:12px;font-weight:700}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--warn)}.hint{font-size:12px;color:var(--muted);line-height:1.65}.folderitem{width:100%;text-align:left;margin-bottom:9px}.editor{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}.editor.open{display:block}.editorhead{position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.editinside{max-width:760px;margin:auto;padding:22px 18px 140px}.titleinput{width:100%;font-size:26px;font-weight:820;letter-spacing:-.8px;background:none;border:0;outline:0;color:var(--ink);margin-bottom:15px}.bodyinput{width:100%;min-height:52vh;resize:none;background:none;border:0;outline:0;color:var(--ink);font-size:16px;line-height:1.8}.foottools{position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--panel);border-top:1px solid var(--line);padding:10px max(15px,calc((100vw - 750px)/2));padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between}.foottools button{flex:1}.field{width:100%;border:1px solid var(--line);padding:12px;border-radius:12px;background:var(--panel);color:var(--ink);font-size:16px}.modal{position:fixed;inset:0;background:#0e142080;z-index:60;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--panel);border-radius:25px 25px 0 0;padding:20px;width:100%;max-width:700px;max-height:85dvh;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 16px}.sheet button{margin:3px}.choicebtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin:8px 0!important;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:17px;color:var(--ink)}.choiceicon{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--accent);font-size:25px;flex-shrink:0}.choicebtn strong{display:block;font-size:15px}.choicebtn small{color:var(--muted);display:block;margin-top:5px}.release{padding:15px 0;border-bottom:1px solid var(--line)}.release h4{margin:0 0 8px}.release ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.9}.settingline{padding:15px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#252d43;color:#fff;border-radius:99px;padding:11px 18px;font-size:13px;z-index:99;display:none;white-space:nowrap;max-width:90vw}.toast.show{display:block}@media(min-width:650px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:370px){.foottools .action{font-size:12px;padding:10px 6px}}@media(prefers-reduced-motion:no-preference){.note,.action,.chip{transition:background .15s,border-color .15s}}
</style></head><body><div id="app"><header class="top"><div class="bar"><div><div class="brand">✦ 모아노트</div><div class="sub" id="subtitle">나만의 로컬 노트</div></div><button class="pill" id="topAction">+ 만들기</button></div></header><main class="content" id="view"></main><button class="fab" id="fab" title="폴더 또는 노트 만들기">+</button><nav class="nav"><button data-tab="all" class="active"><span class="symbol">▤</span>전체 노트</button><button data-tab="folders"><span class="symbol">▦</span>폴더</button><button data-tab="favorites"><span class="symbol">☆</span>즐겨찾기</button><button data-tab="settings"><span class="symbol">⚙</span>설정</button></nav></div>
<section class="editor" id="editor"><div class="editorhead"><div class="bar"><button class="action" id="backBtn">← 돌아가기</button><span class="hint" id="saveStatus">자동 저장</span><button class="action" id="moreBtn">···</button></div></div><div class="editinside"><input class="titleinput" id="noteTitle" maxlength="140" placeholder="노트 제목"><textarea class="bodyinput" id="noteBody" placeholder="여기에 자유롭게 기록해 보세요."></textarea><div class="hint" id="editedAt"></div></div><div class="foottools"><button class="action" id="folderBtn">▦ 폴더</button><button class="action" id="favoriteBtn">☆ 즐겨찾기</button><button class="action primary" id="shareBtn">↗ 공유</button></div></section>
<div class="modal" id="modal"><div class="sheet"><div class="bar"><h3 id="modalTitle"></h3><button class="iconbtn" id="closeModal">✕</button></div><div id="modalContent"></div></div></div><div class="toast" id="toast"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),DB='moanote-db',STORE='state',APP_VERSION='1.5.0';let db=null,state={notes:[],folders:[{id:'default',name:'기본 폴더'}],theme:'system'},tab='all',filter='all',search='',editing=null,saveTimer=0,toastTimer=0,multiMode=false,selectedNotes=new Set();
const id=()=>globalThis.crypto?.randomUUID?.()||('n'+Date.now()+Math.random().toString(36).slice(2));
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>new Date(x).toLocaleDateString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('app');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function writeDB(){if(!db)return Promise.reject(new Error('DB 미연결'));return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function save(){try{await writeDB();if(editing)$('saveStatus').textContent='✓ 저장됨'}catch(e){toast('저장 실패 · JSON 백업을 이용하세요');console.error(e)}}
function scheduleSave(){if(editing)$('saveStatus').textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark'||state.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function folderName(fid){return state.folders.find(f=>f.id===fid)?.name||'기본 폴더'}
function selectTab(t){flushEditor();multiMode=false;selectedNotes.clear();tab=t;filter='all';search='';render()}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('fab').hidden=tab==='settings';$('topAction').hidden=tab==='settings';$('subtitle').textContent=({all:'나만의 로컬 노트',folders:'내 폴더 관리',favorites:'중요한 기록 모아보기',settings:'저장 및 앱 설정'})[tab];if(tab==='settings')return renderSettings();if(tab==='folders')return renderFolders();renderNotes()}
function renderNotes(){let list=state.notes.filter(n=>!n.deletedAt).filter(n=>tab!=='favorites'||n.favorite).filter(n=>filter==='all'||n.folderId===filter).filter(n=>(n.title+' '+n.body).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(!!b.pinned-!!a.pinned)||(state.sort==='oldest'?a.updated-b.updated:state.sort==='title'?(a.title||'').localeCompare(b.title||'','ko'):b.updated-a.updated));$('view').innerHTML=`<input class="search" id="search" placeholder="⌕  제목이나 내용 검색" value="${escapeHtml(search)}"><div class="chips" id="chips"><button class="chip ${filter==='all'?'active':''}" data-folder="all">전체</button>${state.folders.map(f=>`<button class="chip ${filter===f.id?'active':''}" data-folder="${escapeHtml(f.id)}">${escapeHtml(f.name)}</button>`).join('')}</div>${filter!=='all'?`<div class="panel"><div class="hint">${escapeHtml(folderPath(filter))}</div><div class="chips">${folderChildren(filter).map(f=>`<button class="chip" data-enterfolder="${escapeHtml(f.id)}">▦ ${escapeHtml(f.name)}</button>`).join('')}</div></div>`:''}<div class="row"><div class="sectiontitle">${tab==='favorites'?'즐겨찾기':'내 노트'} · ${list.length}개</div><button class="action" id="multiToggle" style="padding:8px">${multiMode?'선택 종료':'☑ 여러 개 선택'}</button><select class="field" id="sortNotes" aria-label="노트 정렬" style="width:auto;font-size:13px;padding:8px"><option value="recent">최근 수정</option><option value="oldest">오래된 순</option><option value="title">제목 순</option></select></div>${multiMode?`<div class="bulkbar"><strong>${selectedNotes.size}개 선택</strong><button class="action" id="selectAll">전체 선택</button><button class="action" id="bulkMove">폴더 이동</button><button class="action" id="bulkFavorite">★ 즐겨찾기</button><button class="action danger" id="bulkDelete">휴지통</button></div>`:''}<div class="cards">${list.map(n=>`<button class="note ${selectedNotes.has(n.id)?'selected':''}" data-note="${escapeHtml(n.id)}"><span class="nTitle">${n.pinned?'📌 ':''}${multiMode?(selectedNotes.has(n.id)?'☑ ':'□ '):''}${n.favorite?'★ ':''}${escapeHtml(n.title||'제목 없음')}</span><span class="preview">${escapeHtml(n.body||'내용을 작성해 보세요')}</span><span class="meta"><span><i class="folderDot" style="background:${safeColor(state.folders.find(f=>f.id===n.folderId)?.color)}"></i>${escapeHtml(folderName(n.folderId))}</span><span>${fmt(n.updated)}</span></span></button>`).join('')}</div>${list.length?'':'<div class="empty"><strong>아직 노트가 없어요</strong>아래 + 버튼으로 첫 기록을 만들어 보세요.</div>'}`;$('sortNotes').value=state.sort||'recent';$('sortNotes').onchange=e=>{state.sort=e.target.value;save();renderNotes()};$('search').addEventListener('input',e=>{search=e.target.value;let p=e.target.selectionStart;renderNotes();$('search').focus();$('search').setSelectionRange(p,p)});document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{filter=b.dataset.folder;renderNotes()});document.querySelectorAll('[data-enterfolder]').forEach(b=>b.onclick=()=>{filter=b.dataset.enterfolder;renderNotes()});$('multiToggle').onclick=()=>{multiMode=!multiMode;selectedNotes.clear();renderNotes()};if(multiMode){$('selectAll').onclick=()=>{list.forEach(n=>selectedNotes.add(n.id));renderNotes()};$('bulkMove').onclick=()=>{if(!selectedNotes.size)return toast('먼저 노트를 선택하세요');folderPicker('선택한 노트 이동',async target=>{state.notes.filter(n=>selectedNotes.has(n.id)).forEach(n=>{n.folderId=target;n.updated=Date.now()});await save();multiMode=false;selectedNotes.clear();renderNotes();toast('노트를 이동했어요')})};$('bulkFavorite').onclick=async()=>{state.notes.filter(n=>selectedNotes.has(n.id)).forEach(n=>n.favorite=true);await save();multiMode=false;selectedNotes.clear();renderNotes();toast('즐겨찾기 등록 완료')};$('bulkDelete').onclick=async()=>{if(!selectedNotes.size||!confirm(`${selectedNotes.size}개 노트를 휴지통으로 이동할까요?`))return;state.notes.filter(n=>selectedNotes.has(n.id)).forEach(n=>n.deletedAt=Date.now());await save();selectedNotes.clear();multiMode=false;renderNotes();toast('휴지통으로 이동했어요')}}document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{if(multiMode){selectedNotes.has(b.dataset.note)?selectedNotes.delete(b.dataset.note):selectedNotes.add(b.dataset.note);renderNotes()}else openEditor(b.dataset.note)})}
function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#e6a648'}
function folderChildren(parent){return state.folders.filter(f=>f.id!=='default'&&(f.parentId||'default')===parent)}
function folderPath(fid){let parts=[],seen=new Set();while(fid&&fid!=='default'&&!seen.has(fid)){seen.add(fid);let f=state.folders.find(x=>x.id===fid);if(!f)break;parts.unshift(f.name);fid=f.parentId||'default'}return '기본 폴더'+(parts.length?' / '+parts.join(' / '):'')}
function descendants(fid){let found=new Set(),walk=x=>{for(let f of folderChildren(x))if(!found.has(f.id)){found.add(f.id);walk(f.id)}};walk(fid);return found}
function folderPicker(title,onPick,excluded=[]){let blocked=new Set(excluded);let options=state.folders.filter(f=>!blocked.has(f.id));showModal(title,`<p class="hint">이동할 폴더를 선택하세요. 저장 즉시 적용됩니다.</p><div style="display:grid;gap:6px">${options.map(f=>`<button class="choicebtn" data-pick="${escapeHtml(f.id)}"><span class="choiceicon">▦</span><span><strong>${escapeHtml(f.name)}</strong><small>${escapeHtml(folderPath(f.id))}</small></span></button>`).join('')}</div>`);document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{let target=b.dataset.pick;closeModal();await onPick(target)})}
function moveFolder(fid){let f=state.folders.find(x=>x.id===fid);if(!f||fid==='default')return;folderPicker('폴더 이동 · '+f.name,async target=>{if(target===fid||descendants(fid).has(target)){toast('자기 폴더 안으로 이동할 수 없어요');return}f.parentId=target;await save();render();toast('폴더 이동 완료')},[fid,...descendants(fid)])}
function renderFolders(){multiMode=false;selectedNotes.clear();let rows=[];let walk=(parent,depth,seen)=>{for(let f of folderChildren(parent)){if(seen.has(f.id))continue;seen.add(f.id);rows.push(`<div class="panel" style="margin-left:${Math.min(depth,5)*12}px"><div class="row" style="gap:6px"><button class="action folderitem" data-openfolder="${escapeHtml(f.id)}">${'　'.repeat(Math.min(depth,3))}<i class="folderDot" style="background:${safeColor(f.color)}"></i>${escapeHtml(f.name)} <span class="hint">(${state.notes.filter(n=>!n.deletedAt&&n.folderId===f.id).length})</span></button><button class="action" data-child="${escapeHtml(f.id)}" title="하위 폴더 만들기">＋</button><button class="action" data-color="${escapeHtml(f.id)}" title="폴더 색상">🎨</button><button class="action" data-movefolder="${escapeHtml(f.id)}">이동</button><button class="action" data-rename="${escapeHtml(f.id)}">수정</button><button class="action danger" data-del="${escapeHtml(f.id)}">삭제</button></div></div>`);walk(f.id,depth+1,seen)}};walk('default',0,new Set());$('view').innerHTML=`<div class="panel"><div class="row"><div><strong>폴더 관리</strong><div class="hint">폴더 안에 폴더를 만들거나 다른 폴더로 이동할 수 있어요.</div></div><button class="action primary" id="newFolder">+ 추가</button></div></div><div class="panel row"><button class="action folderitem" data-openfolder="default">▦ 기본 폴더</button><button class="action" data-child="default">＋ 하위 폴더</button></div>${rows.join('')}`;$('newFolder').onclick=()=>addFolder('default');document.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>addFolder(b.dataset.child));document.querySelectorAll('[data-openfolder]').forEach(b=>b.onclick=()=>{tab='all';filter=b.dataset.openfolder;render()});document.querySelectorAll('[data-movefolder]').forEach(b=>b.onclick=()=>moveFolder(b.dataset.movefolder));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>chooseFolderColor(b.dataset.color));document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let f=state.folders.find(f=>f.id===b.dataset.rename),v=prompt('새 폴더 이름',f.name);if(v?.trim()){f.name=v.trim().slice(0,35);await save();render()}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{let f=state.folders.find(f=>f.id===b.dataset.del);if(!f)return;let parent=f.parentId||'default';if(confirm(`“${f.name}” 폴더를 삭제할까요? 안의 노트와 하위 폴더는 상위 폴더로 이동합니다.`)){state.notes.forEach(n=>{if(n.folderId===f.id)n.folderId=parent});state.folders.forEach(x=>{if(x.parentId===f.id)x.parentId=parent});state.folders=state.folders.filter(x=>x.id!==f.id);await save();render()}})}
function chooseFolderColor(fid){let f=state.folders.find(x=>x.id===fid);if(!f)return;let colors=['#e6a648','#e1646a','#5e8bdc','#43a58c','#9877d4','#667688','#e78b4d','#da72ae'];showModal('폴더 색상 · '+escapeHtml(f.name),`<p class="hint">폴더를 구분할 색상을 선택하세요.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${colors.map(c=>`<button class="action" data-foldercolor="${c}" style="height:58px;background:${c};border:3px solid ${f.color===c?'var(--ink)':'transparent'}" aria-label="${c} 선택"></button>`).join('')}</div>`);document.querySelectorAll('[data-foldercolor]').forEach(b=>b.onclick=async()=>{f.color=b.dataset.foldercolor;await save();closeModal();render();toast('폴더 색상을 변경했어요')})}
function openCreateMenu(){showModal('무엇을 만들까요?',`<p class="hint">원하는 항목을 선택해 주세요. 폴더로 정리하거나 새로운 노트를 바로 작성할 수 있어요.</p><button class="choicebtn" id="choiceFolder"><span class="choiceicon">▦</span><span><strong>새 폴더 만들기</strong><small>노트를 주제별로 묶어 정리해요</small></span></button><button class="choicebtn" id="choiceNote"><span class="choiceicon">✎</span><span><strong>새 노트 만들기</strong><small>글을 작성하고 자동으로 저장해요</small></span></button>`);$('choiceFolder').onclick=()=>{closeModal();addFolder(filter!=='all'?filter:'default')};$('choiceNote').onclick=()=>{closeModal();newNote()}}
function showReleaseNotes(){showModal('버전별 업데이트 내역',`<p class="hint">모아노트 <strong>v${APP_VERSION}</strong> · 업데이트해도 기존 로컬 기록을 유지하도록 설계했어요. 단, 같은 사이트 주소와 브라우저 저장 공간을 사용해야 해요.</p><div class="release"><h4>v1.5.0 <span class="pill" style="font-size:11px">최신</span></h4><ul><li>여러 노트 선택 후 한꺼번에 폴더 이동·즐겨찾기·휴지통</li><li>폴더별 색상 지정 및 노트 목록에서 색상 표시</li><li>중요한 노트 상단 고정 기능</li><li>도움말과 업데이트 내역 개선</li></ul></div><div class="release"><h4>v1.4.0</h4><ul><li>폴더 안에 하위 폴더 생성</li><li>노트를 원하는 폴더로 이동</li><li>폴더를 다른 폴더 아래로 이동</li><li>순환 이동 방지와 폴더 삭제 시 자식 항목 보존</li></ul></div><div class="release"><h4>v1.3.0</h4><ul><li>실수로 삭제한 노트를 복구할 수 있는 휴지통</li><li>최근 수정·오래된 순·제목 순 정렬</li><li>노트 공유 시 최신 입력 내용 반영</li><li>모바일 메뉴 전환 안정성 및 사용법 안내 보강</li></ul></div><div class="release"><h4>v1.2.0</h4><ul><li>노트 공유 메뉴 개선: 여러 장 PNG, 긴 이미지, PDF, 텍스트</li><li>설정에 단계별 도움말과 FAQ 추가</li><li>최초 실행 안내를 1회만 표시하고 버전 업데이트와 분리</li></ul></div><div class="release"><h4>v1.1.0</h4><ul><li>추가 버튼을 폴더 / 노트 선택 메뉴로 변경</li><li>버전별 업데이트 내역 화면 추가</li><li>설정에서 언제든 업데이트 내역 확인 가능</li><li>기존 IndexedDB 저장 구조 유지</li></ul></div><div class="release"><h4>v1.0.0 · 첫 출시</h4><ul><li>로컬 자동 저장 및 노트 작성·수정·삭제</li><li>폴더 관리, 검색, 즐겨찾기, 테마</li><li>JSON 백업 및 복원</li><li>PNG, 텍스트, PDF/인쇄 공유</li><li>모바일 화면과 고정 하단 메뉴</li></ul></div><button class="action primary" id="releaseClose" style="width:100%;margin-top:18px">확인</button>`);$('releaseClose').onclick=closeModal}
function showHelp(){showModal('모아노트 도움말',`<div class="release"><h4>① 노트와 폴더 만들기</h4><p class="hint">홈 상단의 + 만들기 또는 아래 + 버튼을 누른 뒤 <b>새 노트</b>나 <b>새 폴더</b>를 선택하세요. 노트는 입력할 때 자동 저장됩니다.</p></div><div class="release"><h4>② 폴더 / 즐겨찾기</h4><p class="hint">노트 편집 화면의 폴더 버튼으로 이동할 폴더를 지정하세요. 폴더 화면의 ＋ 버튼으로 하위 폴더를 만들고 이동 버튼으로 폴더 위치를 변경할 수 있어요. 별 버튼으로 즐겨찾기를 표시합니다.</p></div><div class="release"><h4>③ 노트 공유 방법</h4><p class="hint">공유할 노트를 연 뒤 하단의 <b>↗ 공유</b>를 누르세요. 기본은 <b>여러 장 PNG</b>입니다. 긴 PNG, PDF 저장/인쇄, 전체 텍스트 공유도 선택할 수 있습니다. 기기마다 공유 시트 지원 여부는 달라요.</p></div><div class="release"><h4>④ 여러 노트 관리 · 폴더 색상 · 상단 고정</h4><p class="hint">전체 노트의 <b>여러 개 선택</b>을 누르고 노트를 선택하면 한꺼번에 이동·즐겨찾기·휴지통으로 보낼 수 있어요. 폴더 탭의 🎨 버튼으로 폴더 색상을 설정하세요. 노트 편집의 ··· 메뉴에서 상단 고정을 사용할 수 있습니다.</p></div><div class="release"><h4>⑤ 휴지통과 정렬</h4><p class="hint">노트에서 ··· → 휴지통으로 이동을 누르면 실수로 삭제한 노트를 설정 → 휴지통에서 복원할 수 있습니다. 전체 노트 상단에서 최신·오래된·제목 순으로 정렬할 수 있어요.</p></div><div class="release"><h4>⑥ 백업과 복원</h4><p class="hint"><b>설정 → JSON 백업</b>으로 파일을 내려받으세요. 다른 기기에서는 <b>백업 복원</b>을 사용합니다. 복원하면 기존 노트를 대체하니 먼저 백업하세요.</p></div><div class="release"><h4>⑦ 자주 묻는 질문</h4><p class="hint"><b>Q. 업데이트하면 기록이 지워지나요?</b><br>같은 주소·브라우저·저장 공간을 유지하면 일반적으로 기록이 유지됩니다. 주소 변경이나 브라우저 데이터 삭제 시 사라질 수 있으니 백업하세요.<br><br><b>Q. 첫 시작 안내가 매번 뜨나요?</b><br>아니요. 시작하기를 한 번 누르면 앱 버전이 바뀌어도 안내를 다시 표시하지 않습니다. 사이트 저장 공간이 삭제되거나 다른 주소·브라우저에서 열면 다시 표시될 수 있어요.<br><br><b>Q. 공유할 때 이미지가 한 장만 전송돼요.</b><br>일부 앱과 브라우저는 여러 장 공유에 제약이 있습니다. 그런 경우 PNG 저장 후 사진 앱에서 선택하거나 PDF/긴 이미지 방식을 이용해 주세요.</p></div><button class="action primary" id="helpClose" style="width:100%">닫기</button>`);$('helpClose').onclick=closeModal}
async function addFolder(parentId=filter!=='all'?filter:'default'){if(!state.folders.some(f=>f.id===parentId))parentId='default';let v=prompt('새 폴더 이름');if(!v?.trim())return;state.folders.push({id:id(),name:v.trim().slice(0,35),parentId});await save();render();toast('폴더 생성 완료')}
function renderSettings(){$('view').innerHTML=`<div class="panel"><strong>데이터 보관</strong><p class="hint">노트는 이 브라우저의 IndexedDB에 저장됩니다. 서버로 전송하지 않습니다. 브라우저 데이터 삭제, 기기 변경 등에 대비해 JSON 백업을 보관하세요.</p><div class="row"><button class="action primary" id="backup">↓ JSON 백업</button><button class="action" id="restore">↑ 백업 복원</button></div></div><div class="panel"><strong>화면 테마</strong><p class="hint">선택 즉시 적용됩니다.</p><select class="field" id="theme"><option value="system">기기 설정에 맞춤</option><option value="light">라이트</option><option value="dark">다크</option></select></div><div class="panel"><div class="row"><div><strong>업데이트 내역</strong><p class="hint">현재 버전 v${APP_VERSION}<br>버전별 개선 사항을 확인할 수 있어요.</p></div><button class="action primary" id="releaseNotes">내역 보기</button></div></div><div class="panel"><div class="row"><div><strong>도움말 · 사용 방법</strong><p class="hint">노트 작성, 공유, 백업, 최초 안내에 대해 알아보세요.</p></div><button class="action primary" id="helpButton">도움말</button></div></div><div class="panel"><div class="row"><div><strong>휴지통</strong><p class="hint">삭제한 노트를 복원하거나 영구 삭제할 수 있어요.</p></div><button class="action" id="openTrash">휴지통 (${state.notes.filter(n=>n.deletedAt).length})</button></div></div><div class="panel"><strong>앱 정보</strong><p class="hint">오프라인 단일 HTML · 로컬 자동 저장 · 폴더 · 검색 · 즐겨찾기 · PNG/텍스트 공유 · 인쇄/PDF</p><div class="row"><span class="hint">노트 ${state.notes.length}개 / 폴더 ${state.folders.length}개</span><button class="action danger" id="reset">전체 초기화</button></div></div>`;$('theme').value=state.theme;$('theme').onchange=async e=>{state.theme=e.target.value;applyTheme();await save()};$('openTrash').onclick=showTrash;$('releaseNotes').onclick=showReleaseNotes;$('helpButton').onclick=showHelp;$('backup').onclick=backup;$('restore').onclick=()=>$('importFile').click();$('reset').onclick=async()=>{if(confirm('모든 노트와 폴더를 영구 삭제할까요? 복구할 수 없습니다.')&&confirm('최종 확인: 정말 모두 삭제하시겠습니까?')){state.notes=[];state.folders=[{id:'default',name:'기본 폴더'}];await save();render();toast('초기화 완료')}}}
function showTrash(){let deleted=state.notes.filter(n=>n.deletedAt).sort((a,b)=>b.deletedAt-a.deletedAt);showModal('휴지통',`<p class="hint">삭제한 기록은 자동으로 영구 삭제되지 않습니다. 필요한 노트는 복원하세요.</p>${deleted.map(n=>`<div class="panel"><strong>${escapeHtml(n.title||'제목 없음')}</strong><p class="hint">삭제일 ${fmt(n.deletedAt)}</p><div class="row"><button class="action primary" data-undelete="${escapeHtml(n.id)}">복원</button><button class="action danger" data-erase="${escapeHtml(n.id)}">영구 삭제</button></div></div>`).join('')||'<div class="empty">휴지통이 비어 있어요.</div>'}`);document.querySelectorAll('[data-undelete]').forEach(b=>b.onclick=async()=>{let n=state.notes.find(n=>n.id===b.dataset.undelete);if(!n)return;delete n.deletedAt;await save();showTrash();toast('노트 복원 완료')});document.querySelectorAll('[data-erase]').forEach(b=>b.onclick=async()=>{if(!confirm('영구 삭제하면 복구할 수 없습니다. 계속할까요?'))return;state.notes=state.notes.filter(n=>n.id!==b.dataset.erase);await save();showTrash();toast('영구 삭제 완료')})}
function newNote(){let n={id:id(),title:'',body:'',folderId:filter!=='all'?filter:'default',favorite:false,created:Date.now(),updated:Date.now()};state.notes.unshift(n);save();openEditor(n.id)}
function openEditor(nid){editing=state.notes.find(n=>n.id===nid);if(!editing)return;$('noteTitle').value=editing.title;$('noteBody').value=editing.body;$('saveStatus').textContent='✓ 저장됨';$('editedAt').textContent='마지막 수정 '+fmt(editing.updated);$('favoriteBtn').textContent=editing.favorite?'★ 즐겨찾기':'☆ 즐겨찾기';$('editor').classList.add('open');$('editor').scrollTop=0}
function flushEditor(){if(!editing)return;editing.title=$('noteTitle').value;editing.body=$('noteBody').value;clearTimeout(saveTimer);save();editing=null}
$('noteTitle').oninput=$('noteBody').oninput=()=>{if(!editing)return;editing.title=$('noteTitle').value;editing.body=$('noteBody').value;editing.updated=Date.now();scheduleSave()};$('backBtn').onclick=()=>{flushEditor();$('editor').classList.remove('open');render()};$('favoriteBtn').onclick=()=>{if(!editing)return;editing.favorite=!editing.favorite;$('favoriteBtn').textContent=editing.favorite?'★ 즐겨찾기':'☆ 즐겨찾기';save();toast(editing.favorite?'즐겨찾기에 추가':'즐겨찾기 해제')};$('folderBtn').onclick=()=>{if(!editing)return;editing.title=$('noteTitle').value;editing.body=$('noteBody').value;folderPicker('노트 이동',async target=>{editing.folderId=target;editing.updated=Date.now();await save();toast('노트 이동 완료')})};
$('moreBtn').onclick=()=>{showModal('노트 관리',`<button class="action" id="pinNote">📌 ${editing.pinned?'상단 고정 해제':'상단 고정'}</button><button class="action" id="duplicate">⧉ 복제하기</button><button class="action danger" id="delete">휴지통으로 이동</button><p class="hint">설정 → 휴지통에서 나중에 복원할 수 있어요.</p>`);$('pinNote').onclick=async()=>{editing.pinned=!editing.pinned;await save();closeModal();toast(editing.pinned?'상단에 고정했어요':'고정을 해제했어요')};$('duplicate').onclick=async()=>{let n={...editing,id:id(),title:(editing.title||'제목 없음')+' (복사)',created:Date.now(),updated:Date.now()};state.notes.unshift(n);await save();closeModal();flushEditor();openEditor(n.id);toast('노트 복제 완료')};$('delete').onclick=async()=>{if(!confirm('이 노트를 삭제할까요?'))return;editing.deletedAt=Date.now();editing=null;await save();closeModal();$('editor').classList.remove('open');render();toast('휴지통으로 이동했어요')}};
function showModal(t,html){$('modalTitle').textContent=t;$('modalContent').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function backup(){download(new Blob([JSON.stringify({app:'moanote',version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),'moanote-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('백업 파일 저장 완료')}
$('importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.app!=='moanote'||!Array.isArray(j.data?.notes)||!Array.isArray(j.data?.folders))throw Error('잘못된 형식');if(!confirm(`노트 ${j.data.notes.length}개를 복원할까요? 기존 노트는 대체됩니다.`))return;state={...j.data,notes:j.data.notes,folders:j.data.folders,theme:j.data.theme||'system'};await save();applyTheme();render();toast('복원 완료')}catch(err){alert('복원에 실패했습니다. 모아노트 JSON 백업인지 확인하세요.')}finally{e.target.value=''}};
// Wrapped canvas cards: export a sequence of full-content PNG pages without content clipping.
function makePages(n){let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas not available');const W=1000,H=1414,margin=78,textW=W-margin*2;canvas.width=W;canvas.height=H;let lines=[],font='32px sans-serif';ctx.font=font;let paragraphs=(n.body||' ').replace(/\t/g,'    ').split('\n');for(let paragraph of paragraphs){if(!paragraph){lines.push('');continue}let line='';for(let ch of paragraph){if(ctx.measureText(line+ch).width>textW&&line){lines.push(line);line=ch}else line+=ch}lines.push(line)}let per=29,pages=[];for(let start=0;start<lines.length||start===0;start+=per){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5966dd';ctx.fillRect(margin,72,72,7);ctx.fillStyle='#1b2840';ctx.font='bold 47px sans-serif';let title=n.title||'제목 없음';while(ctx.measureText(title).width>textW&&title.length>1)title=title.slice(0,-2)+'…';ctx.fillText(title,margin,160);ctx.fillStyle='#728099';ctx.font='24px sans-serif';ctx.fillText('모아노트  ·  '+new Date(n.updated).toLocaleDateString('ko-KR'),margin,207);ctx.strokeStyle='#e7eaf0';ctx.beginPath();ctx.moveTo(margin,242);ctx.lineTo(W-margin,242);ctx.stroke();ctx.font=font;ctx.fillStyle='#263247';lines.slice(start,start+per).forEach((line,i)=>ctx.fillText(line,margin,300+i*35));ctx.fillStyle='#a0a9ba';ctx.font='22px sans-serif';ctx.fillText(`${Math.floor(start/per)+1} / ${Math.max(1,Math.ceil(lines.length/per))}`,W-165,H-64);pages.push(canvas.toDataURL('image/png'))}return pages}
async function shareText(n){let txt=(n.title||'제목 없음')+'\n\n'+n.body;if(navigator.share){try{await navigator.share({title:n.title||'모아노트',text:txt});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(txt);toast('전체 텍스트 복사 완료')}catch(e){let t=document.createElement('textarea');t.value=txt;t.style.position='fixed';document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('전체 텍스트 복사 완료')}}
async function shareImages(n){let imgs=makePages(n);let files=await Promise.all(imgs.map(async (s,i)=>new File([await(await fetch(s)).blob()],`moanote-${i+1}.png`,{type:'image/png'})));if(navigator.canShare?.({files})&&navigator.share){try{await navigator.share({files,title:n.title||'모아노트'});return}catch(e){if(e.name==='AbortError')return}}imgs.forEach((s,i)=>{let a=document.createElement('a');a.href=s;a.download=`moanote-${i+1}.png`;document.body.append(a);a.click();a.remove()});toast(`PNG ${imgs.length}장 저장 완료`)}
function shareLong(n){let imgs=makePages(n);if(imgs.length===1){downloadData(imgs[0],'moanote-long.png');return}let first=document.createElement('img');first.onload=()=>{let c=document.createElement('canvas');c.width=first.naturalWidth;c.height=first.naturalHeight*imgs.length;if(c.height>32000){toast('너무 길어서 여러 장 PNG를 이용해 주세요');return}let ctx=c.getContext('2d'),loaded=0;imgs.forEach((s,i)=>{let im=new Image();im.onload=()=>{ctx.drawImage(im,0,i*first.naturalHeight);if(++loaded===imgs.length)downloadData(c.toDataURL('image/png'),'moanote-long.png')};im.src=s})};first.src=imgs[0]}
function downloadData(s,name){let a=document.createElement('a');a.href=s;a.download=name;document.body.append(a);a.click();a.remove();toast('이미지 저장 완료')}
function printNote(n){let frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-9999px;width:1px;height:1px';document.body.append(frame);let d=frame.contentDocument;d.open();d.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>노트 PDF</title><style>body{font:16px/1.8 sans-serif;padding:30px;color:#1a2538}h1{font-size:26px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}@page{margin:18mm}</style></head><body><h1>'+escapeHtml(n.title||'제목 없음')+'</h1><pre>'+escapeHtml(n.body)+'</pre></body></html>');d.close();setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),1500)},250)}
$('shareBtn').onclick=()=>{if(!editing)return;let n={...editing,title:$('noteTitle').value,body:$('noteBody').value,updated:Date.now()};showModal('노트 공유',`<p class="hint">공유할 방식을 선택하세요. 기본 설정은 여러 장 PNG입니다. 기기가 지원하면 공유 메뉴가 열리고, 미지원 시 이미지 파일로 저장됩니다.</p><div style="display:grid;gap:8px"><button class="action primary" id="multiPng">▧ 여러 장 PNG (기본)</button><button class="action" id="longPng">▤ 긴 이미지 한 장</button><button class="action" id="pdfPrint">▤ PDF 저장 / 인쇄</button><button class="action" id="copyText">⧉ 전체 텍스트 복사 / 공유</button></div>`);$('multiPng').onclick=async()=>{closeModal();try{await shareImages(n)}catch(e){alert('이미지 공유 실패: '+e.message)}};$('longPng').onclick=()=>{closeModal();try{shareLong(n)}catch(e){alert(e.message)}};$('pdfPrint').onclick=()=>{closeModal();printNote(n)};$('copyText').onclick=()=>{closeModal();shareText(n)}};
$('fab').onclick=$('topAction').onclick=openCreateMenu;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();if(editing){flushEditor();$('editor').classList.remove('open');render()}else backup()}if(e.key==='Escape'&&$('modal').classList.contains('show'))closeModal()});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>{if(!['INPUT','TEXTAREA'].includes(e.target.tagName))e.preventDefault()});
(async()=>{try{db=await openDB();let saved=await readDB();if(saved?.notes&&saved?.folders)state=saved;applyTheme();render();let welcomed=false;try{welcomed=localStorage.getItem('moanote-welcome-v1')==='1'}catch(e){welcomed=true}if(!welcomed){showModal('모아노트에 오신 것을 환영해요',`<p class="hint">모든 기록은 현재 기기의 브라우저에 보관됩니다. 노트는 자동 저장되고, <b>설정 → JSON 백업</b>으로 다른 기기로 옮길 수 있어요.</p><button class="action primary" id="welcomeOk">시작하기</button>`);$('welcomeOk').onclick=()=>{try{localStorage.setItem('moanote-welcome-v1','1')}catch(e){console.warn('환경 설정 저장 제한',e)}closeModal()}}}catch(e){console.error(e);$('view').innerHTML='<div class="empty"><strong>로컬 저장소 연결 실패</strong>일반 브라우저에서 열어 주세요. 사생활 보호 모드나 제한된 미리보기에서는 저장이 차단될 수 있습니다.</div>';toast('로컬 저장소 확인 필요')}})();
})();
</script></body></html>
